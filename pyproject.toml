[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mancq"
version = "1.3.0"
description = "MANC-Q: Metabolite Abundance by NMR Curve-fitting, Quantified. 1H NMR metabolite quantification by whole-spectrum fitting of simulated GISSMO spin systems"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "William Smith" }]
dependencies = ["numpy>=1.23", "scipy>=1.10", "pandas>=1.5", "matplotlib>=3.6", "nmrglue>=0.9", "openpyxl>=3.0", "PySide6-Essentials>=6.5"]

[project.scripts]
mancq = "mancq.__main__:main"

[project.gui-scripts]
mancq-gui = "mancq.gui.app:main"

[tool.setuptools]
packages = ["mancq", "mancq.gui"]

[tool.setuptools.package-data]
mancq = ["library/*", "help/*.md", "help/images/*.png"]

[project.urls]
Homepage = "https://github.com/willwas1/MANC-Q"
Issues = "https://github.com/willwas1/MANC-Q/issues"
