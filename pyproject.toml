[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mancq"
version = "2.0.4"
description = "MANC-Q: Metabolite Abundance by NMR Curve-fitting, Quantified. 1H NMR metabolite quantification by whole-spectrum fitting of simulated GISSMO spin systems"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "William Smith" }]
# the lowest versions tested (an Anaconda install on Windows, Python 3.13); constraints.txt has the newest tested
dependencies = ["numpy>=2.3", "scipy>=1.16", "pandas>=2.3", "matplotlib>=3.10", "nmrglue>=0.12", "openpyxl>=3.1",
                "PySide6-Essentials>=6.9"]

[project.scripts]
mancq = "mancq.__main__:main"

[project.gui-scripts]
mancq-gui = "mancq.gui.app:main"

[tool.setuptools]
packages = ["mancq", "mancq.gui"]

[tool.setuptools.package-data]
mancq = ["library/*", "help/*.md", "help/images/*.png"]
"mancq.gui" = ["assets/*"]

[project.urls]
Homepage = "https://github.com/willwas1/MANC-Q"
Issues = "https://github.com/willwas1/MANC-Q/issues"
