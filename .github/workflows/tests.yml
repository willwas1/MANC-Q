# Runs the checks on every push and pull request, on GitHub's own Linux computers (nothing to run yourself).
# A red cross next to a commit on GitHub means a check failed: open it to see which one. All checks use the
# synthetic demo spectra only.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install MANC-Q (tested package versions) and pytest
        run: python -m pip install . pytest -c constraints.txt

      - name: Checks in tests/ (overwrite warning, subset rerun, results tables, figures, shift table, pH)
        run: python -m pytest tests -v

      - name: Cut-down demo (EXPNO 10 and 13; fails if any of its own checks fails)
        run: python -m mancq demo ci_demo --quick
