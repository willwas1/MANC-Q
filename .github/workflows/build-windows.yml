# Builds the Windows installer and a portable zip on GitHub's own Windows computers, and attaches them to the
# release. You do not need to run anything yourself: publish a release on GitHub (Releases > Draft a new
# release > tag e.g. v1.1.0 > Publish) and about 15 minutes later MANC-Q-setup.exe appears on the release page.
# It can also be started by hand from the Actions tab ("Run workflow"); the files are then under the run's Artifacts.
name: Build Windows app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MANC-Q and PyInstaller (tested package versions)
        run: python -m pip install . pyinstaller -c constraints.txt

      - name: Build dist/MANC-Q/MANC-Q.exe
        run: python packaging/build_app.py

      - name: Self-test (fits the synthetic demo spectra with the built app)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MANC-Q\MANC-Q.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\MANC-Q selftest\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }

      - name: Make the installer and the portable zip
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ("${{ github.event_name }}" -ne "release") { $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value }
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path dist\MANC-Q -DestinationPath dist\MANC-Q-windows-portable.zip
          # checksums, so anyone can confirm their download is the file GitHub built
          Get-FileHash dist\MANC-Q-setup.exe, dist\MANC-Q-windows-portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/MANC-Q-setup.exe
            dist/MANC-Q-windows-portable.zip
            dist/SHA256SUMS.txt

      - name: Keep the files with this run (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v5
        with:
          name: MANC-Q-windows
          path: |
            dist/MANC-Q-setup.exe
            dist/MANC-Q-windows-portable.zip
            dist/SHA256SUMS.txt
